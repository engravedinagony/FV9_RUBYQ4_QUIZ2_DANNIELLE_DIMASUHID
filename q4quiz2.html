<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Grade Rating Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffe6f0; 
            color: #cc0066;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff0f5; 
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            width: 100%;
            max-width: 500px;
            border: 2px solid #ff69b4;
        }

        h1 {
            color: #ff1493; /* deep pink */
            font-weight: bold;
        }

        .subject-img {
            display: block;
            margin: 10px auto 5px;
            width: 50px;
            height: 50px;
        }

        input.form-control {
            background-color: #fff0f5;
            border: 2px solid #ff69b4;
            color: #cc0066;
        }

        input.form-control:focus {
            border-color: #ff1493;
            box-shadow: 0 0 5px #ff69b4;
        }

        .btn {
            background-color: #ff69b4;
            color: white;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #ff1493;
        }

        #result {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #cc0066;
        }

        details summary {
            cursor: pointer;
            color: #ff1493;
        }

        details[open] summary {
            font-weight: bold;
        }

        a {
            color: #ff69b4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center">Grade Rating Calculator</h1>
    <p class="text-center">Enter your grades to see your average and rating.</p>
    
   <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" alt="Filipino" class="subject-img">
        <div class="subject-label">Filipino</div>
        <input type="number" class="form-control" id="grade1" placeholder="Enter grade (0-100)">
    </div>

    <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/1995/1995574.png" alt="English" class="subject-img">
        <div class="subject-label">English</div>
        <input type="number" class="form-control" id="grade2" placeholder="Enter grade (0-100)">
    </div>

    <div class="mb-3 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2913/2913461.png" alt="Science" class="subject-img">
        <div class="subject-label">Science</div>
        <input type="number" class="form-control" id="grade3" placeholder="Enter grade (0-100)">
    </div>

    <button class="btn w-100" onclick="computeAverage()">Compute Average</button>

    
    <div id="result" class="text-center"></div>


<script>
    function computeAverage() {
        const grade1 = parseFloat(document.getElementById("grade1").value);
        const grade2 = parseFloat(document.getElementById("grade2").value);
        const grade3 = parseFloat(document.getElementById("grade3").value);

        if (isNaN(grade1) || isNaN(grade2) || isNaN(grade3)) {
            alert("Please enter valid grades for all three subjects.");
            return;
        }

        const average = (grade1 + grade2 + grade3) / 3;
        let rating = "";

        switch (true) {
            case (average >= 94 && average <= 100):
                rating = "Excellent";
                break;
            case (average >= 87 && average <= 93.99):
                rating = "Above Satisfactory";
                break;
            case (average >= 80 && average <= 86.99):
                rating = "Satisfactory";
                break;
            case (average >= 75 && average <= 79.99):
                rating = "Needs Improvement";
                break;
            case (average >= 70 && average <= 74.99):
                rating = "Poor";
                break;
            default:
                rating = "Invalid average. Please check your input.";
        }

        document.getElementById("result").innerHTML = `
            Average Grade: <strong>${average.toFixed(2)}</strong><br>
            Rating: <strong>${rating}</strong>
        `;
    }
</script>

</body>
</html>
